version: "2"

run:
  build-tags: [integration] # линтер проверяет и integration-тесты

# Неиспользуемые импорты и переменные Go не компилирует сам.
# Мёртвый код (неиспользуемые функции, типы, поля, параметры, недостижимый код)
# ловят unused, unparam и правило revive unreachable-code.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - revive
    - unparam
  settings:
    revive:
      rules:
        - name: var-naming # camelCase для переменных и функций, без snake_case
        - name: receiver-naming
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: context-as-argument
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: redefines-builtin-id
        - name: empty-block
        - name: blank-imports
  exclusions:
    rules:
      # в тестах сигнатуры функций-заглушек задаёт тестируемый код
      - path: _test.go
        linters: [unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - sportreg

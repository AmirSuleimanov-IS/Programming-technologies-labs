# Проверки на каждый push и pull request: линтеры, unit- и integration-тесты, сборка.
# Integration-тесты поднимают PostgreSQL и Redis в контейнерах (testcontainers) — Docker на раннере есть.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend
      - name: Unit-тесты
        run: go test -count=1 ./internal/...
      - name: Integration-тесты (PostgreSQL и Redis в контейнерах)
        run: go test -tags=integration -count=1 ./tests/integration/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Линтер, форматирование, типы, мёртвый код
        run: npm run lint && npm run format:check && npm run typecheck && npm run knip
      - name: Unit-тесты
        run: npm test
      - name: Сборка
        run: npm run build
